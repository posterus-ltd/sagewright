# Codex configuration for the Sagewright runner.
#
# Sagewright authenticates Codex with an OPENAI_API_KEY (an sk-proj… API key),
# NOT a ChatGPT browser login — there is no auth.json anywhere in the stack.
#
# Codex v0.142's built-in `openai` provider prefers the Responses API WebSocket
# transport (wss://api.openai.com/v1/responses). That endpoint only accepts a
# browser *session key* and rejects API keys with a 401 ("must be made with a
# session key … from the browser"). Codex's HTTPS fallback then drops the
# Authorization header (openai/codex#15492), so the session never connects and
# dies after retrying — exactly the "Reconnecting… 5/5" failure we hit.
#
# Pinning a provider with supports_websockets = false forces the plain HTTP
# Responses transport, which authenticates correctly with OPENAI_API_KEY.
model = "gpt-5.5"
model_provider = "openai-apikey"

[model_providers.openai-apikey]
name = "OpenAI (API key, HTTP Responses)"
base_url = "https://api.openai.com/v1"
wire_api = "responses"
env_key = "OPENAI_API_KEY"
supports_websockets = false

# Sagewright's built-in MCP server (spawn sessions / schedule jobs / create workflows).
# The control plane injects SAGEWRIGHT_MCP_URL + SAGEWRIGHT_MCP_TOKEN per session. Codex
# takes the bearer from the injected env var (bearer_token_env_var) but can't read the url
# from env, so start-agent/continue-agent rewrite the line below from SAGEWRIGHT_MCP_URL at
# launch — keeping codex in sync with MCP_PUBLIC_URL even when it's overridden. The value
# here is just the default used if that env var is unset.
[mcp_servers.sagewright]
url = "http://control-plane:3001/mcp"
bearer_token_env_var = "SAGEWRIGHT_MCP_TOKEN"
