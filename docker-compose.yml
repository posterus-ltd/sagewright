services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - sagewright
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sage}']
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane-api/Dockerfile
      args:
        # Baked into the web bundle at build time: 'false' compiles the UI
        # without the permanent-delete action. Same var also gates the API at
        # runtime (below), so one setting drives both.
        ALLOW_SESSION_DELETION: ${ALLOW_SESSION_DELETION:-true}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Built from the POSTGRES_* vars in .env so credentials live in one place.
      # Set DATABASE_URL in .env to override this entirely (e.g. an external Postgres).
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-sage}}
      # Initial password for the seeded `root` account (forced to change on first login).
      ROOT_PASSWORD: ${ROOT_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Encrypts each user's custom per-session .env blob at rest (aes-256-gcm).
      SECRETS_KEY: ${SECRETS_KEY}
      # DESTRUCTIVE one-time switch: when truthy, the migrate step drops the whole
      # public schema before applying migrations. Use it once to clear a database
      # that still holds pre-squash data, then leave it unset. Defaults to off.
      DB_RESET: ${DB_RESET:-}
      # Used to authenticate clones/pulls of the configured repos onto the volume.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RUNNER_IMAGE: sagewright-runner-opencode:latest
      # Full compose network name the spawner attaches each runner container to
      # (the network's `name:` below is fixed so this stays stable regardless of the
      # project directory).
      RUNNER_NETWORK: sagewright
      # Named volume holding the repo clones + per-session worktrees. The spawner
      # binds this into each runner at the SAME path (/sagewright-volume) the control-plane
      # uses, so worktree gitdir links (absolute paths) resolve inside the runner.
      RUNNER_VOLUME: sagewright-repos
      PORT: 3001
      # Advertised URL of the /mcp endpoint, injected into every runner as
      # SAGEWRIGHT_MCP_URL so an agent's harness can call the control plane's MCP tools
      # (spawn sessions / schedule jobs / create workflows) back over the internal
      # `sagewright` network. Defaults to this in-cluster address; override only if the
      # control plane is reachable at a different internal host/port. Not published — the
      # endpoint has no host port and every call needs the per-session injected token.
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://control-plane:3001/mcp}
      # Set to 'false' on deployments that must retain session history for
      # auditing: archiving keeps working, permanent deletion is refused.
      ALLOW_SESSION_DELETION: ${ALLOW_SESSION_DELETION:-true}
    ports:
      - '3001:3001'
    networks:
      - sagewright
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sagewright-repos:/sagewright-volume

  # ---------------------------------------------------------------------------
  # Optional HTTPS sidecar (profile: https). Terminates TLS with a self-signed
  # certificate and proxies to the control-plane's existing plain-HTTP port —
  # needed so the web app can be installed as a PWA when reached via a LAN
  # IP/hostname instead of localhost (browsers only treat plain HTTP as a
  # secure context on localhost). Entirely decoupled from the control-plane
  # app itself: skip the `https` profile if your deployment already terminates
  # TLS some other way (a real reverse proxy, a cloud load balancer, …).
  #
  # Enable:  docker compose --profile https up -d
  # Disable: just don't pass --profile https (or `docker compose rm -s -f
  #          cert-init tls-proxy` to remove them from an existing stack).
  # ---------------------------------------------------------------------------
  cert-init:
    profiles: ['https']
    image: alpine:3
    volumes:
      - ./traefik/certs:/certs
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /certs/cert.pem ] && [ -f /certs/key.pem ]; then
          echo "Self-signed certificate already exists in ./traefik/certs — skipping."
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout /certs/key.pem -out /certs/cert.pem \
          -subj "/CN=sagewright-control-plane" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

  tls-proxy:
    profiles: ['https']
    image: traefik:v3.3
    depends_on:
      cert-init:
        condition: service_completed_successfully
      control-plane:
        condition: service_started
    command:
      - --entryPoints.websecure.address=:8443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - '${HTTPS_PORT:-8443}:8443'
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      - sagewright

  # Build-only services for runner images. Runner containers are spawned
  # dynamically by the control-plane via the Docker socket (not run by compose),
  # so these services exist solely so `docker compose --profile build build`
  # bakes the host .env auth tokens into each image as build args. The `build`
  # profile keeps `docker compose up` from trying to run them.
  # To add a new runner, copy an existing runners/<name>/ folder, update the
  # YOUR HARNESS block + start script, set the LABEL name/description, add a
  # matching service here, then run `docker compose --profile build build`.
  runner-opencode:
    profiles: ["build"]
    image: sagewright-runner-opencode:latest
    build:
      context: .
      dockerfile: runners/opencode/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  runner-claude-code:
    profiles: ["build"]
    image: sagewright-runner-claude-code:latest
    build:
      context: .
      dockerfile: runners/claude-code/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  runner-codex:
    profiles: ["build"]
    image: sagewright-runner-codex:latest
    build:
      context: .
      dockerfile: runners/codex/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  runner-pi:
    profiles: ["build"]
    image: sagewright-runner-pi:latest
    build:
      context: .
      dockerfile: runners/pi/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  # Basic CLI runner (no agent) — hosts shell/terminal widget sessions. No LLM
  # provider key: it ships no harness, just CLI tools driven by the control plane.
  runner-shell:
    profiles: ["build"]
    image: sagewright-runner-shell:latest
    build:
      context: .
      dockerfile: runners/shell/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}

networks:
  sagewright:
    name: sagewright

volumes:
  pgdata: {}
  # Shared across the control-plane and every runner. Runners attach it via the
  # spawner's HostConfig.Binds (compose can't, since runners aren't compose services).
  sagewright-repos:
    name: sagewright-repos
