services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sage
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    networks:
      - sagewright
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane-api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sage
      APP_PASSWORD: ${APP_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      # Encrypts each user's custom per-session .env blob at rest (aes-256-gcm).
      SECRETS_KEY: ${SECRETS_KEY}
      # DESTRUCTIVE one-time switch: when truthy, the migrate step drops the whole
      # public schema before applying migrations. Use it once to clear a database
      # that still holds pre-squash data, then leave it unset. Defaults to off.
      DB_RESET: ${DB_RESET:-}
      # Used to authenticate clones/pulls of the configured repos onto the volume.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Used by the control-plane's Linear integration (task source=linear).
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      CONTROL_PLANE_URL: http://control-plane:3000
      WORKER_IMAGE: sagewright-worker-opencode:latest
      # Full compose network name (the network's `name:` below is fixed so this is
      # stable regardless of the project directory). Worker containers are attached
      # to this network so the `control-plane` hostname resolves for /internal/* calls.
      WORKER_NETWORK: sagewright
      # Named volume holding the repo clones + per-session worktrees. The spawner
      # binds this into each worker at the SAME path (/sagewright-volume) the control-plane
      # uses, so worktree gitdir links (absolute paths) resolve inside the worker.
      WORKER_VOLUME: sagewright-repos
      PORT: 3000
    ports:
      - '3000:3000'
    networks:
      - sagewright
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sagewright-repos:/sagewright-volume

  # ---------------------------------------------------------------------------
  # Optional HTTPS sidecar (profile: https). Terminates TLS with a self-signed
  # certificate and proxies to the control-plane's existing plain-HTTP port —
  # needed so the web app can be installed as a PWA when reached via a LAN
  # IP/hostname instead of localhost (browsers only treat plain HTTP as a
  # secure context on localhost). Entirely decoupled from the control-plane
  # app itself: skip the `https` profile if your deployment already terminates
  # TLS some other way (a real reverse proxy, a cloud load balancer, …).
  #
  # Enable:  docker compose --profile https up -d
  # Disable: just don't pass --profile https (or `docker compose rm -s -f
  #          cert-init tls-proxy` to remove them from an existing stack).
  # ---------------------------------------------------------------------------
  cert-init:
    profiles: ['https']
    image: alpine:3
    volumes:
      - ./traefik/certs:/certs
    entrypoint:
      - sh
      - -c
      - |
        if [ -f /certs/cert.pem ] && [ -f /certs/key.pem ]; then
          echo "Self-signed certificate already exists in ./traefik/certs — skipping."
          exit 0
        fi
        apk add --no-cache openssl >/dev/null
        openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
          -keyout /certs/key.pem -out /certs/cert.pem \
          -subj "/CN=sagewright-control-plane" \
          -addext "subjectAltName=DNS:localhost,IP:127.0.0.1"

  tls-proxy:
    profiles: ['https']
    image: traefik:v3.3
    depends_on:
      cert-init:
        condition: service_completed_successfully
      control-plane:
        condition: service_started
    command:
      - --entryPoints.websecure.address=:8443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - '${HTTPS_PORT:-8443}:8443'
    volumes:
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/certs:ro
    networks:
      - sagewright

  # Build-only services for worker images. Worker containers are spawned
  # dynamically by the control-plane via the Docker socket (not run by compose),
  # so these services exist solely so `docker compose --profile build build`
  # bakes the host .env auth tokens into each image as build args. The `build`
  # profile keeps `docker compose up` from trying to run them.
  # To add a new worker, copy an existing workers/<name>/ folder, update the
  # YOUR HARNESS block + start script, set the LABEL name/description, add a
  # matching service here, then run `docker compose --profile build build`.
  worker-opencode:
    profiles: ["build"]
    image: sagewright-worker-opencode:latest
    build:
      context: .
      dockerfile: workers/opencode/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  worker-claude-code:
    profiles: ["build"]
    image: sagewright-worker-claude-code:latest
    build:
      context: .
      dockerfile: workers/claude-code/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

  worker-codex:
    profiles: ["build"]
    image: sagewright-worker-codex:latest
    build:
      context: .
      dockerfile: workers/codex/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  worker-pi:
    profiles: ["build"]
    image: sagewright-worker-pi:latest
    build:
      context: .
      dockerfile: workers/pi/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
        ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

networks:
  sagewright:
    name: sagewright

volumes:
  pgdata: {}
  # Shared across the control-plane and every worker. Workers attach it via the
  # spawner's HostConfig.Binds (compose can't, since workers aren't compose services).
  sagewright-repos:
    name: sagewright-repos
