<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sagewright — a fleet of agents that reason &amp; build</title>
    <meta
      name="description"
      content="Run multiple coding agents at once without juggling terminals. Sagewright's control plane runs in your browser, on any device, with full session persistence."
    />
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Apply the visitor's pinned theme before first paint to avoid a flash.
         Key + values mirror src/app/use-theme.ts. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('sagewright:theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {}
      })();
    </script>

    <link rel="stylesheet" href="/src/styles.css" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sagewright.dev" />
    <meta
      property="og:title"
      content="Craftsman of wisdom · builder of knowledge"
    />
    <meta
      property="og:description"
      content="Every run compounds your org's capability and context into a strategic asset you own — self-hosted and sovereign, yet model- and provider-agnostic, turning synthetic intelligence into a swappable commodity."
    />
    <meta
      property="og:image"
      content="https://sagewright.dev/screenshots/sagewright-og-dark.png"
    />
    <meta property="og:site_name" content="Sagewright" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@yoursite" />
    <meta name="twitter:creator" content="@yourname" />
    <meta
      name="twitter:title"
      content="Craftsman of wisdom · builder of knowledge"
    />
    <meta
      name="twitter:description"
      content="Every run compounds your org's capability and context into a strategic asset you own — self-hosted and sovereign, yet model- and provider-agnostic, turning synthetic intelligence into a swappable commodity."
    />
    <meta
      name="twitter:image"
      content="https://sagewright.dev/screenshots/canvas.png"
    />

    <!-- Generated with https://tinytoolstack.com -->

    <!-- https://vibesmonitor.com script -->

      data-project-id="244ad1f4-6315-419e-85da-4da6c1dd67a8"
      src="https://vibesmonitor.com/script/v1/vibesmonitor.js"
      type="text/javascript"
      defer
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
